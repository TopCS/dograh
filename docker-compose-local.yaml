services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: >
      --requirepass redissecret
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redissecret", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9000:9000" # Bind to localhost explicitly
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Local-dev LiveKit agent bridge. Same image as the main stack, but pointed at
  # the host-run API (http://host.docker.internal:8000) and fail-fast
  # (restart: "no") so local iteration surfaces config errors immediately.
  # Opt-in via the "livekit" profile; see api/.env.example for the variables.
  dograh-livekit:
    build:
      context: ./dograh-livekit
      dockerfile: Dockerfile
    container_name: dograh-livekit-local
    profiles: ["livekit"]
    restart: "no"
    # Host-network bridge so the container reaches the host-run API on macOS
    # (native) and Linux (needs host-gateway defined below).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # LiveKit Cloud / self-hosted server credentials
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      # Dograh internal API running on the host (not dockerized in local dev).
      # MUST share the host API's DOGRAH_INTERNAL_TOKEN.
      DOGRAH_API_URL: "${DOGRAH_API_URL:-http://host.docker.internal:8000}"
      DOGRAH_INTERNAL_TOKEN: "${DOGRAH_INTERNAL_TOKEN:-}"
      # AI provider credentials used by the agent workers (LLM/TTS/STT)
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      CARTESIA_API_KEY: "${CARTESIA_API_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge
